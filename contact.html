        <section class="sonar-contact-area section-padding-100">
            <!-- back end content -->
            <div class="backEnd-content">
                <img class="dots" src="img/core-img/dots.png" alt="">
            </div>
            
            <div class="container">
                <div class="row">
                    <!-- Contact Form Area -->
                    <div class="col-12">
                        <div class="contact-form text-center">

                            <h4>Deixe seu comentário:</h4>

                            <form action="#" method="get">
                                <div class="row">
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <input type="text" class="form-control" id="contact-name" required="required" minlength ="3" maxlength="100" pattern="[A-Za-zÀ-ÿ\s]+" placeholder="Seu nome: obrigatório">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <input type="email" class="form-control" id="contact-email" required="required" pattern=" [a-z-9. %+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" placeholder="Seu e-mail: obrigatório">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <input type="tel" class="form-control" id="contact-fone" required="required" minlength="11" maxlength="16" pattern="\[0-9]{4,6}-[0-9]{3,4}$" placeholder="Telefone: obrigatório" title="Seu telefone: obrigatório.">
                                        </div>
                                    </div>
                                    <div class="select123" id="select123">
                                        <label for="carros">Avalie nosso site:</label>
                                        <select name="nota" required id="nota">
                                            <div="select1234">
                                                <option value="" disabled selected>Selecione...</option>
                                                <option value="zero">0</option>
                                                <option value="um">1</option>
                                                <option value="dois">2</option>
                                                <option value="tres">3</option>
                                                <option value="quatro">4</option>
                                                <option value="cinco">5</option>
                                            </div>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-group">
                                            <textarea class="form-control" name="message" id="message" cols="30" rows="10" placeholder="Comente aqui."></textarea>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn sonar-btn">Enviar</button>
                                        <button type="reset" class="btn sonar-btn">Limpar</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
